<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h3a_bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="h3a_sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="h3a_glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.88)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.32)"/>
    </linearGradient>
    <linearGradient id="h3a_needle_n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="h3a_needle_s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="h3a_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="h3a_sun_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#h3a_bg)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

  <!-- Compass Dial Rings -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Cardinal Ticks -->
  <line x1="64" y1="14" x2="64" y2="22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="106" x2="64" y2="114" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="64" x2="22" y2="64" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <line x1="106" y1="64" x2="114" y2="64" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- Secondary Ticks -->
  <line x1="28" y1="28" x2="33" y2="33" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="100" y1="28" x2="95" y2="33" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="28" y1="100" x2="33" y2="95" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="95" y2="95" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Diagonal Rays -->
  <polygon points="64,64 36,36 64,54" fill="rgba(255,255,255,0.06)"/>
  <polygon points="64,64 92,36 64,54" fill="rgba(255,255,255,0.1)"/>
  <polygon points="64,64 36,92 54,64" fill="rgba(255,255,255,0.06)"/>
  <polygon points="64,64 92,92 74,64" fill="rgba(255,255,255,0.08)"/>

  <!-- West & East rays -->
  <polygon points="18,64 58,69 64,64 58,59" fill="#475569"/>
  <polygon points="110,64 70,59 64,64 70,69" fill="#94a3b8"/>

  <!-- South ray (amber) -->
  <polygon points="64,112 69,72 64,64 59,72" fill="url(#h3a_needle_s)"/>
  <polygon points="64,112 64,64 59,72" fill="#b45309"/>

  <!-- North ray (cyan) -->
  <polygon points="64,16 70,56 64,64 58,56" fill="url(#h3a_needle_n)"/>
  <polygon points="64,16 64,64 70,56" fill="#0369a1"/>

  <!-- Compass Hub Ring -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>

  <!-- Glowing 3D Sun -->
  <circle cx="70" cy="50" r="23" fill="url(#h3a_sun)" filter="url(#h3a_sun_glow)"/>
  <circle cx="70" cy="50" r="29" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-dasharray="3 5" stroke-opacity="0.45"/>

  <!-- Frosted Glass Cloud with Drop Shadow -->
  <g filter="url(#h3a_shadow)">
    <path d="M 44 86 C 36 86, 30 79, 30 71 C 30 63, 36 57, 43 56 C 46 46, 56 39, 68 39 C 81 39, 91 47, 94 59 C 100 60, 105 65, 105 72 C 105 80, 99 86, 91 86 Z"
          fill="url(#h3a_glass)" stroke="rgba(255,255,255,0.92)" stroke-width="1.8"/>
  </g>

  <!-- Aerodynamic Drops -->
  <circle cx="48" cy="96" r="3" fill="#38bdf8" opacity="0.9"/>
  <circle cx="66" cy="98" r="4" fill="#38bdf8" opacity="0.95"/>
  <circle cx="84" cy="96" r="3" fill="#38bdf8" opacity="0.9"/>
</svg>
